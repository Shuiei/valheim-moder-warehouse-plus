# Codecov (https://app.codecov.io/gh/Shuiei/valheim-moder-warehouse-plus): the unit tests' coverage of
# the plugin, which CircleCI's tests job sends on main (branches send none). Which code counts is set
# by tests/coverage.runsettings.
# The check fails under 70% of the plugin's lines (about 78% are covered). Not the Editor's 95%: what is
# left needs the game itself (Unity, the game's item database, the network: stubbed in the tests) or
# players near a warehouse; tools/server-smoke.sh checks the plugin in a real server.
# Reference: https://docs.codecov.com/docs/codecovyml-reference
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: 70%
        threshold: 0%
    patch: off

comment: false
