# The pipeline's start (a setup workflow, CircleCI's dynamic configuration): says whether a release is
# due, then runs .circleci/continue.yml, where the tests, the package and the release are.
# A release is due on main when the plugin's version (Version in ModerWarehouse/WarehousePlugin.cs) has
# a dated heading in thunderstore/CHANGELOG.md (not "unreleased") and is not tagged yet: the release
# workflow then runs the tests and waits for an approval (README.md, Releasing).
version: 2.1
setup: true

orbs:
  # CircleCI's orb that hands the pipeline on to another configuration. Any 1.x.
  continuation: circleci/continuation@1

jobs:
  setup:
    executor: continuation/default
    steps:
      - checkout
      - run:
          name: Is a release due?
          command: |
            release=false
            version=$(sed -n 's/.*const string Version = "\([0-9.]*\)".*/\1/p' ModerWarehouse/WarehousePlugin.cs)
            if [ "$CIRCLE_BRANCH" = main ] && grep -q "^## $version — [0-9]" thunderstore/CHANGELOG.md \
              && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
              release=true
            fi
            echo "Release of v$version due: $release"
            echo "{\"release\": $release}" > /tmp/parameters.json
      - continuation/continue:
          configuration_path: .circleci/continue.yml
          parameters: /tmp/parameters.json

workflows:
  setup:
    jobs:
      - setup
