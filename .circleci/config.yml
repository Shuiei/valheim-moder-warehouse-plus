# Moder Warehouse Plus: build the package on every push; publish it on a version tag.
#   game-dlls  the game's DLLs the plugin builds against, from the free Valheim dedicated server
#              (Steam app 896660, anonymous login): only the five it needs are kept
#   package    the Thunderstore package (thunderstore/build.sh, every warning an error), against
#              those DLLs and BepInEx, ServersideQoL and YamlDotNet from Thunderstore
#              (tools/ci-deps.sh, the versions manifest.json depends on); kept as an artifact
#   publish    on a tag vX.Y.Z only, once the package is built: the tag must match the plugin's
#              version, then tools/publish.py sends the zip to a GitHub release, Thunderstore, Hexium
#              and Nexus Mods. Its tokens are in the context mod-token, shared by the mods' projects
#              (GITHUB_TOKEN, THUNDERSTORE_TOKEN, HEXIUM_TOKEN, NEXUS_API_KEY); NEXUS_MOD_ID is this
#              project's own environment variable. Publishing is permanent: a version number goes
#              to each site once (a re-run skips the sites that already have it).
version: 2.1

jobs:
  game-dlls:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - run:
          name: SteamCMD (32-bit, needs the i386 C++ runtime)
          command: |
            sudo dpkg --add-architecture i386
            sudo apt-get update -qq
            sudo apt-get install -y -qq lib32gcc-s1 lib32stdc++6 > /dev/null
            mkdir -p ~/steamcmd
            curl -fsSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar -xz -C ~/steamcmd
      - run:
          name: The Valheim dedicated server (anonymous)
          no_output_timeout: 20m
          command: |
            # SteamCMD updates itself on its first run and sometimes exits non-zero then: retry.
            for attempt in 1 2 3; do
              ~/steamcmd/steamcmd.sh +force_install_dir /tmp/valheim +login anonymous +app_update 896660 validate +quit \
                && [ -f /tmp/valheim/valheim_server_Data/Managed/assembly_valheim.dll ] && break
              echo "SteamCMD attempt $attempt failed"; sleep 10
            done
            mkdir -p /tmp/libs/managed
            for dll in assembly_valheim assembly_guiutils assembly_utils UnityEngine.CoreModule UnityEngine; do
              cp "/tmp/valheim/valheim_server_Data/Managed/$dll.dll" /tmp/libs/managed/
            done
            ls -l /tmp/libs/managed
      - persist_to_workspace:
          root: /tmp/libs
          paths:
            - managed

  package:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:10.0
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: /tmp/libs
      - run:
          name: Tools (zip, unzip)
          command: apt-get update -qq && apt-get install -y -qq zip unzip > /dev/null
      - run:
          name: BepInEx, ServersideQoL and YamlDotNet from Thunderstore
          command: tools/ci-deps.sh /tmp/libs/mods
      - run:
          name: Build the package (every warning is an error)
          command: |
            thunderstore/build.sh /tmp/dist -p:ManagedDir=/tmp/libs/managed \
              -p:BepInExCoreDir=/tmp/libs/mods/core -p:PluginsDir=/tmp/libs/mods/plugins
      - store_artifacts:
          path: /tmp/dist
      - persist_to_workspace:
          root: /tmp
          paths:
            - dist

  publish:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - attach_workspace:
          at: /tmp
      - run:
          name: The tag is the plugin's version
          command: |
            version=$(sed -n 's/.*const string Version = "\([0-9.]*\)".*/\1/p' ModerWarehouse/WarehousePlugin.cs)
            [ "$CIRCLE_TAG" = "v$version" ] || { echo "Tag $CIRCLE_TAG does not match the plugin's version $version."; exit 1; }
            echo "export VERSION=$version" >> "$BASH_ENV"
      - run:
          name: Publish to GitHub, Thunderstore, Hexium and Nexus Mods
          command: |
            pip install --quiet httpx==0.28.1
            python tools/publish.py "/tmp/dist/ModerWarehousePlus-$VERSION.zip" "$VERSION"

workflows:
  # Branches build the package; a tag vX.Y.Z builds it and publishes it.
  release:
    jobs:
      - game-dlls:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - package:
          requires:
            - game-dlls
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - publish:
          context: mod-token
          requires:
            - package
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
